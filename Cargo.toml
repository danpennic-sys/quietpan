[package]
name = "quietpan"
version = "0.1.0"
edition = "2021"
description = "Quiet Pan - Private computation platform"
license = "Proprietary"
rust-version = "1.85"

[dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
base64 = "=0.21.7"
hmac = "=0.12.1"
sha2 = "=0.10.8"
thiserror = "=1.0.57"
digest = "=0.10.7"
crypto-common = "=0.1.6"
block-buffer = "=0.10.4"
generic-array = "=0.14.7"
typenum = "=1.17.0"
cpufeatures = "=0.2.12"
cfg-if = "=1.0.0"
subtle = "=2.5.0"
itoa = "=1.0.11"
ryu = "=1.0.17"
memchr = "=2.7.2"
serde_derive = "=1.0.197"
proc-macro2 = "=1.0.79"
quote = "=1.0.35"
unicode-ident = "=1.0.12"
syn = { version = "=2.0.55", features = ["derive"] }

[lib]
name = "quietpan"
path = "src/lib.rs"
